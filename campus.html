<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="IsoGSM 3D — Atmospheric water vapor tracer dynamics">
    <title>IsoGSM — Atmospheric Vapor Tracer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Roboto+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100;0,300;0,400;1,300&family=Syncopate:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "netcdfjs": "https://esm.sh/netcdfjs",
                "grib2js": "https://esm.sh/grib2js"
            }
        }
    </script>
</head>

<body>
    <audio id="sfx-ping" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>
    <script>
        if (window.location.protocol === 'file:') {
            alert('Protocol error: serve via a local HTTP server (Live Server, python -m http.server, etc.)');
        }
    </script>

    <!-- THE 3D BACKGROUND -->
    <main id="main-content">
        <div id="canvas-container"></div>
        <div id="canvas-2d-container" style="display:none;">
            <canvas id="canvas-2d"></canvas>
        </div>
        
        <!-- NOUVEAU: DAY COUNTER POUR L'INSTALLATION -->
        <div id="day-counter" style="position: absolute; bottom: 40px; right: 50px; font-family: 'Syncopate', sans-serif; font-size: 1.2rem; color: rgba(255, 255, 255, 0.7); letter-spacing: 2px; z-index: 1000; text-shadow: 0 2px 10px rgba(0,0,0,0.5);">DAY 1</div>
    </main>

    <!-- WORKBENCH UI -->
    <div id="app-ui" style="opacity: 0; pointer-events: none; transition: opacity 1.5s ease;">
        <div id="arcade-viseur">
            <div class="viseur-box">
                <div class="viseur-target">[ + ]</div>
                <img id="viseur-flag" src="" width="30" style="display:none; border-radius:3px;">
                <div id="viseur-text">Turn the knob...</div>
                <div class="viseur-help">PRESS PEDAL TO LOCK</div>
            </div>
        </div>

        <!-- TOP BAR -->
        <div id="top-bar">
            <div class="top-left">
                <div class="tabs">
                    <button id="btn-connect-cockpit" class="btn-minimal"
                        style="color: #00f2ff; border: 1px solid #00f2ff; margin-bottom: 15px;">
                        🕹️ Connect HMI
                    </button>
                </div>
            </div>

            <div class="top-center">
                <div id="archive-specific-ui" style="display: flex; gap: 30px;">
                    <!-- Les infos Tracer et Day ont été supprimées pour un design plus minimaliste -->
                </div>
                <div id="local-specific-ui" style="display:none; gap: 30px;">
                    <!-- Dynamic select -->
                </div>
                <div id="upload-view" style="display:none; gap: 15px; align-items: center;">
                    <button id="btn-back-archives" class="btn-minimal">← Back</button>
                    <button id="btn-browse" class="btn-minimal">Browse Files</button>
                    <input type="file" id="file-input" style="display: none;">
                    <span style="font-size: 10px; color: #888;">(.nc, .bin, .ft supported)</span>
                </div>
            </div>

            <div class="top-right" style="display: flex; gap: 15px; align-items: center;">
                <div id="archive-data-group">
                    <button id="toggle-data" class="btn-minimal">Season: Summer</button>
                </div>
                <button id="btn-toggle-data-type" class="btn-minimal" style="color: var(--text-accent);">Mode:
                    Vapor</button>
                <button id="btn-toggle-wind" class="btn-minimal" style="color: var(--text-secondary);">Wind:
                    OFF</button>
                <button id="btn-toggle-autorotate" class="btn-minimal">Auto-Rotate: ON</button>
                <button id="btn-lang" class="btn-minimal">EN / JP</button>
            </div>
        </div>

        <!-- BOTTOM CONSOLE -->
        <div id="bottom-console">
            <!-- PLAYBACK -->
            <div id="playback-console">
                <span id="date-display">01 JUL 2017</span>
                <button id="btn-play" class="btn-minimal">▶ Play</button>
                <div class="slider-wrap" style="flex-grow: 1;">
                    <input type="range" id="time-slider" min="0" max="90" value="0" aria-label="Time Slider" title="Time Slider">
                </div>
            </div>

            <!-- RANKING -->
            <div id="ranking-horizontal">
                <div class="city-slot" id="slot-0"></div>
                <div class="city-slot" id="slot-1"></div>
                <div class="city-slot" id="slot-2"></div>
                <div class="city-slot" id="slot-3"></div>
                <div class="city-slot" id="slot-4"></div>
            </div>
        </div>

        <!-- LEGEND (Floating Bottom Left) -->
        <div class="legend" style="position: absolute; bottom: 100px; left: 20px;">
            <div class="legend-title">Atmospheric Vapor [kg/m²]</div>
            <div class="color-blocks">
                <div style="background:#ffffff; color:#000;">Tr</div>
                <div style="background:#f2f9ff"></div>
                <div style="background:#e5f4ff"></div>
                <div style="background:#cceaff"></div>
                <div style="background:#b2e0ff"></div>
                <div style="background:#99d1ff"></div>
                <div style="background:#84c1ff"></div>
                <div style="background:#70b2ff"></div>
                <div style="background:#60a5f9"></div>
                <div style="background:#5199ef"></div>
                <div style="background:#478ee5"></div>
                <div style="background:#337ad1"></div>
                <div style="background:#2e70c4"></div>
                <div style="background:#1c467a; color:#fff;">&gt;10</div>
            </div>
            <div class="color-labels">
                <span>0.001</span>
                <span>0.05</span>
                <span>10.0</span>
            </div>
        </div>

    </div>

    <script type="module" src="campus.js?v=2029"></script>
</body>

</html>
